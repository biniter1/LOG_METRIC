# Workload giả lập để có metrics + logs thật chảy qua hệ thống.
#  - podinfo x2       : expose /metrics (được 2 vmagent scrape), sinh log HTTP.
#  - load-generator   : gọi podinfo liên tục -> counter tăng đều.
#  - flow-generator   : in log JSON giống "flow log" của Tier 1, CÓ SỐ THỨ TỰ seq.
#                       seq tăng 1 đơn vị mỗi dòng -> dùng để ĐO chính xác:
#                         rows == uniq(seq)   => không trùng
#                         uniq(seq) == max-min+1 => không mất dòng nào
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
spec:
  selector: {app: podinfo}
  ports:
    - {name: http, port: 9898}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - {name: http, containerPort: 9898}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: curl
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                wget -qO- http://podinfo:9898/ >/dev/null 2>&1
                wget -qO- http://podinfo:9898/status/500 >/dev/null 2>&1
                sleep 1
              done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-generator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: flow-generator}
  template:
    metadata:
      labels: {app: flow-generator}
    spec:
      containers:
        - name: flow-generator
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                for pair in "frontend:cart:8080" "cart:redis:6379" "checkout:payment:50051" "frontend:catalog:3550" "checkout:email:8080"; do
                  i=$((i+1))
                  src=${pair%%:*}; rest=${pair#*:}; dst=${rest%%:*}; port=${rest#*:}
                  echo "{\"msg\":\"flow observed\",\"seq\":$i,\"src\":\"$src\",\"dst\":\"$dst\",\"port\":$port,\"proto\":\"TCP\"}"
                done
                sleep 1
              done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
