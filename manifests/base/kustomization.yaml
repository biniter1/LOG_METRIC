apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - 00-namespace.yaml
  - 01-s3-credentials.yaml
  - 02-minio.yaml
  - 10-vmstorage.yaml
  - 11-vminsert.yaml
  - 12-vmselect.yaml
  - 13-vmagent.yaml
  - 20-victorialogs.yaml
  - 21-vlagent.yaml
  - 30-vmauth.yaml
  - 31-grafana.yaml

configMapGenerator:
  - name: vl-backup-scripts
    files:
      - scripts/vl-backup-loop.sh
      - scripts/vl-restore-if-empty.sh
  - name: vm-backup-scripts
    files:
      - scripts/vm-backup-loop.sh
      - scripts/vm-restore-if-empty.sh
  - name: vmagent-config
    files:
      - config/scrape.yml
  - name: vmauth-config
    files:
      - config/vmauth.yml
  - name: grafana-datasources
    files:
      - config/datasources.yml

generatorOptions:
  disableNameSuffixHash: true

# Đổi phiên bản tại MỘT chỗ duy nhất.
# Kiểm tra tag mới nhất trước khi triển khai:
#   https://github.com/VictoriaMetrics/VictoriaMetrics/releases
#   https://github.com/VictoriaMetrics/VictoriaLogs/releases
images:
  - name: victoriametrics/vmstorage
    newTag: v1.153.0-cluster
  - name: victoriametrics/vminsert
    newTag: v1.153.0-cluster
  - name: victoriametrics/vmselect
    newTag: v1.153.0-cluster
  - name: victoriametrics/vmagent
    newTag: v1.153.0
  - name: victoriametrics/vmauth
    newTag: v1.153.0
  - name: victoriametrics/vmbackup
    newTag: v1.153.0
  - name: victoriametrics/vmrestore
    newTag: v1.153.0
  - name: victoriametrics/victoria-logs
    newTag: v1.53.0
  - name: victoriametrics/vlagent
    newTag: v1.53.0
  - name: rclone/rclone
    newTag: "1.69.1"
  - name: minio/minio
    newTag: RELEASE.2025-04-22T22-12-26Z
  - name: minio/mc
    newTag: RELEASE.2025-04-16T18-13-26Z
  - name: grafana/grafana
    newTag: "12.2.0"
