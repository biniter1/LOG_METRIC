# vlagent - DaemonSet, mỗi node 1 con. Vừa là COLLECTOR vừa là REPLICATOR:
#  - -kubernetesCollector: tự đọc log mọi container trên node (/var/log/containers),
#    gắn metadata (kubernetes.pod_name, pod_namespace, container_name, labels...).
#  - 2 lần -remoteWrite.url: gửi MỖI dòng log ra CẢ vlogs-a VÀ vlogs-b.
#  - Buffer riêng cho từng URL trên hostPath: B down thì log của B dồn vào buffer,
#    A vẫn nhận bình thường; B lên lại thì vlagent đẩy bù.
#  - Checkpoint (offset đã đọc) nằm trên hostPath: restart không đọc lại -> không trùng.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vlagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vlagent-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vlagent-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vlagent-lab
subjects:
  - kind: ServiceAccount
    name: vlagent
    namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
spec:
  selector:
    matchLabels: {app: vlagent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: vlagent}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9429"
    spec:
      serviceAccountName: vlagent
      tolerations:
        - operator: Exists          # chạy cả trên control-plane để lấy đủ log
      containers:
        - name: vlagent
          image: victoriametrics/vlagent
          args:
            - -kubernetesCollector
            - -tmpDataPath=/var/lib/vlagent
            - -remoteWrite.url=http://vlogs-a:9428/insert/native
            - -remoteWrite.url=http://vlogs-b:9428/insert/native
            - -remoteWrite.maxDiskUsagePerURL=1GB
            - -envflag.enable
            - -kubernetesCollector.excludeFilter=kubernetes.pod_name:=%{HOSTNAME}
            - -loggerFormat=json
          env:
            - name: HOSTNAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 9429}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: vlagent-data, mountPath: /var/lib/vlagent}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: vlagent-data
          hostPath:
            path: /var/lib/vlagent
            type: DirectoryOrCreate
