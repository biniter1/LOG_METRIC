# vmselect x2 - stateless, truy vấn.
#  - dedup.minScrapeInterval=15s: gộp bản trùng GIỮA các node (do RF=2) và phần
#    trùng do 2 vmagent mà vmstorage chưa kịp merge.
#  - replicationFactor=2: cho vmselect biết mỗi sample có 2 bản -> khi thiếu tối đa
#    1 vmstorage, kết quả vẫn ĐẦY ĐỦ (không bị đánh dấu partial).
apiVersion: v1
kind: Service
metadata:
  name: vmselect
  labels: {app: vmselect}
spec:
  selector: {app: vmselect}
  ports:
    - {name: http, port: 8481}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vmselect
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: vmselect}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect
spec:
  replicas: 2
  selector:
    matchLabels: {app: vmselect}
  template:
    metadata:
      labels: {app: vmselect}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8481"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: vmselect}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: vmselect
          image: victoriametrics/vmselect
          args:
            - -storageNode=vmstorage-0.vmstorage:8401,vmstorage-1.vmstorage:8401,vmstorage-2.vmstorage:8401
            - -dedup.minScrapeInterval=15s
            - -replicationFactor=2
            - -cacheDataPath=/cache
            - -loggerFormat=json
          ports:
            - {name: http, containerPort: 8481}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: cache, mountPath: /cache}
      volumes:
        - name: cache
          emptyDir: {}
