# Cấu hình scrape DÙNG CHUNG cho cả 2 vmagent (active-active).
#
# QUY TẮC VÀNG:
#  1. Mọi job dùng CÙNG scrape_interval (15s) = -dedup.minScrapeInterval ở vmstorage/vmselect.
#  2. KHÔNG thêm external_labels / label phân biệt replica (vd replica="0").
#     Label khác nhau => 2 series khác nhau => dedup không gộp được => đếm đôi.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Mọi pod có annotation prometheus.io/scrape: "true" + prometheus.io/port
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Chỉ giữ đúng container port trùng với annotation (tránh 1 pod nhiều target)
      - action: keep_if_equal
        source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_port
          - __meta_kubernetes_pod_container_port_number
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: (Failed|Succeeded)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
