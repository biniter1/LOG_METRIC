# Credential S3 dùng chung cho MinIO, vmbackup/vmrestore và rclone.
# LAB ONLY: đổi giá trị trước khi dùng ở môi trường thật,
# hoặc thay bằng IRSA (IAM Role for Service Account) khi chạy trên EKS.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: labadmin
  AWS_SECRET_ACCESS_KEY: labadmin-secret-123
  AWS_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  # rclone đọc cấu hình remote "s3" từ biến môi trường RCLONE_CONFIG_S3_*
  RCLONE_CONFIG_S3_TYPE: s3
  RCLONE_CONFIG_S3_PROVIDER: Minio
  RCLONE_CONFIG_S3_ENV_AUTH: "false"
  RCLONE_CONFIG_S3_ACCESS_KEY_ID: labadmin
  RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: labadmin-secret-123
  RCLONE_CONFIG_S3_ENDPOINT: http://minio:9000
  RCLONE_CONFIG_S3_REGION: us-east-1
